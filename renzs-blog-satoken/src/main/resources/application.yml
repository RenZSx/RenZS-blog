server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:pro}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: '${DB_URL:jdbc:mysql://127.0.0.1:3306/blog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}'
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      auto-commit: true
      pool-name: BlogHikariPool
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      connection-test-query: SELECT 1
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:40MB}
      max-request-size: ${MAX_REQUEST_SIZE:100MB}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:blog-producer}

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# Configure these values through environment variables in deployed environments.
aliyunmail:
  accessKey: ${ALIYUN_MAIL_ACCESS_KEY:}
  secretKey: ${ALIYUN_MAIL_SECRET_KEY:}
  endpoint: ${ALIYUN_MAIL_ENDPOINT:}
  replyAddress: ${ALIYUN_MAIL_REPLY_ADDRESS:}
  accountName: ${ALIYUN_MAIL_ACCOUNT_NAME:}

search:
  mode: ${SEARCH_MODE:mysql}

email:
  mode: ${EMAIL_MODE:direct}

upload:
  mode: ${UPLOAD_MODE:local}
  local:
    url: '${LOCAL_UPLOAD_URL:http://127.0.0.1:8080/uploads/}'
    path: ${LOCAL_UPLOAD_PATH:./uploads/}
  oss:
    url: ${OSS_URL:}
    endpoint: ${OSS_ENDPOINT:}
    accessKeyId: ${OSS_ACCESS_KEY_ID:}
    accessKeySecret: ${OSS_ACCESS_KEY_SECRET:}
    bucketName: ${OSS_BUCKET_NAME:}
  cos:
    url: ${COS_URL:}
    secretId: ${COS_SECRET_ID:}
    secretKey: ${COS_SECRET_KEY:}
    region: ${COS_REGION:}
    bucketName: ${COS_BUCKET_NAME:}

website:
  url: '${WEBSITE_URL:http://localhost:3000}'

qq:
  app-id: ${QQ_APP_ID:}
  check-token-url: ${QQ_CHECK_TOKEN_URL:}
  user-info-url: ${QQ_USER_INFO_URL:}

weibo:
  app-id: ${WEIBO_APP_ID:}
  app-secret: ${WEIBO_APP_SECRET:}
  grant-type: ${WEIBO_GRANT_TYPE:authorization_code}
  redirect-url: ${WEIBO_REDIRECT_URL:}
  access-token-url: ${WEIBO_ACCESS_TOKEN_URL:}
  user-info-url: ${WEIBO_USER_INFO_URL:}

gitee:
  app-id: ${GITEE_APP_ID:}
  app-secret: ${GITEE_APP_SECRET:}
  grant-type: ${GITEE_GRANT_TYPE:authorization_code}
  redirect-url: ${GITEE_REDIRECT_URL:}
  access-token-url: ${GITEE_ACCESS_TOKEN_URL:}
  user-info-url: ${GITEE_USER_INFO_URL:}

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: ${SA_TOKEN_TIMEOUT:2592000}
  active-timeout: ${SA_TOKEN_ACTIVE_TIMEOUT:-1}
  is-concurrent: true
  is-share: true
  max-login-count: ${SA_TOKEN_MAX_LOGIN_COUNT:-1}
  token-style: uuid
  is-log: false
  is-read-cookie: false
  is-read-header: true
  is-print: false
