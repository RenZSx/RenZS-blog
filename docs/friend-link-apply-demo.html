<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>友链申请方案 Demo</title>
  <style>
    :root {
      --page-bg: #f5f8fc;
      --surface: #ffffff;
      --surface-soft: #eef6ff;
      --surface-blue: #e6f1ff;
      --line: #cfe1f7;
      --line-strong: #9fc4f1;
      --text: #26364a;
      --muted: #64748b;
      --blue: #5f95dc;
      --blue-strong: #3578d4;
      --green: #5ea98b;
      --amber: #c99b42;
      --shadow: 0 18px 45px rgba(63, 104, 160, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        linear-gradient(180deg, rgba(230, 241, 255, 0.74), rgba(245, 248, 252, 0.96) 280px),
        var(--page-bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.3;
    }

    .topbar p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .legend {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: max-content;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.8);
      color: var(--blue-strong);
      font-size: 0.88rem;
      font-weight: 700;
    }

    .demo-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .demo-card {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .demo-card.wide {
      grid-column: 1 / -1;
    }

    .demo-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(238, 246, 255, 0.96), rgba(255, 255, 255, 0.92));
    }

    .demo-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-weight: 800;
    }

    .demo-title svg {
      flex: 0 0 auto;
      color: var(--blue);
    }

    .demo-tag {
      flex: 0 0 auto;
      color: var(--blue-strong);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .demo-body {
      padding: 18px;
    }

    .mini-copy {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.7;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .field {
      display: grid;
      gap: 6px;
      color: #3f5674;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .field.wide {
      grid-column: 1 / -1;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: none;
      background: rgba(255, 255, 255, 0.88);
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 600;
    }

    .field input {
      height: 36px;
      padding: 0 10px;
    }

    .field textarea {
      min-height: 70px;
      resize: vertical;
      padding: 9px 10px;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--line-strong);
      box-shadow: 0 0 0 3px rgba(95, 149, 220, 0.12);
    }

    .action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
    }

    .soft-note {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .icon-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 38px;
      border: 0;
      border-radius: 8px;
      padding: 0 14px;
      background: var(--blue);
      color: #fff;
      cursor: pointer;
      font-size: 0.86rem;
      font-weight: 800;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .icon-action:hover {
      background: var(--blue-strong);
      box-shadow: 0 10px 22px rgba(53, 120, 212, 0.22);
      transform: translateY(-2px);
    }

    .split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 240px;
      gap: 16px;
      align-items: stretch;
    }

    .preview-card {
      display: flex;
      flex-direction: column;
      min-height: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }

    .preview-cover {
      position: relative;
      aspect-ratio: 16 / 9;
      background:
        linear-gradient(135deg, rgba(95, 149, 220, 0.82), rgba(154, 198, 242, 0.72)),
        var(--surface-blue);
    }

    .preview-cover::after {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(255, 255, 255, 0.44);
      border-radius: 8px;
    }

    .preview-cover {
      position: absolute;
      left: 16px;
      bottom: -22px;
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border: 3px solid #fff;
      border-radius: 8px;
      background: #eaf4ff;
      color: var(--blue-strong);
      box-shadow: 0 10px 20px rgba(31, 59, 99, 0.14);
    }

    .preview-content {
      padding: 30px 14px 14px;
    }

    .preview-name {
      font-size: 1rem;
      font-weight: 800;
    }

    .preview-desc {
      margin-top: 7px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.6;
    }

    .step-line {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .step-dot {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--surface-blue);
      color: var(--blue-strong);
      font-size: 0.76rem;
    }

    .envelope-stage {
      position: relative;
      min-height: 276px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(246, 250, 255, 0.9), rgba(230, 241, 255, 0.72)),
        #fff;
      overflow: hidden;
    }

    .letter {
      position: absolute;
      left: 34px;
      right: 34px;
      top: 24px;
      min-height: 162px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px 8px 4px 4px;
      background: #fff;
      box-shadow: 0 12px 24px rgba(63, 104, 160, 0.1);
    }

    .letter-lines {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .letter-lines span {
      height: 9px;
      border-radius: 999px;
      background: #dbeafe;
    }

    .letter-lines span:nth-child(2) {
      width: 72%;
    }

    .letter-lines span:nth-child(3) {
      width: 84%;
    }

    .envelope {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 20px;
      height: 114px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background:
        linear-gradient(145deg, transparent 49%, rgba(159, 196, 241, 0.44) 50%),
        linear-gradient(215deg, transparent 49%, rgba(159, 196, 241, 0.44) 50%),
        #edf6ff;
    }

    .plane-button {
      position: absolute;
      right: 24px;
      bottom: 28px;
      width: 74px;
      height: 74px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      color: var(--blue-strong);
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(63, 104, 160, 0.2);
    }

    .pass-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(90deg, rgba(230, 241, 255, 0.96), rgba(255, 255, 255, 0.95)),
        #fff;
      overflow: hidden;
    }

    .pass-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      border-bottom: 1px dashed var(--line-strong);
    }

    .pass-id {
      color: var(--blue-strong);
      font-size: 0.82rem;
      font-weight: 900;
    }

    .stamp {
      display: grid;
      place-items: center;
      width: 74px;
      height: 74px;
      border: 2px solid var(--blue);
      border-radius: 50%;
      color: var(--blue-strong);
      transform: rotate(-10deg);
      font-size: 0.85rem;
      font-weight: 900;
    }

    .pass-content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 94px;
      gap: 14px;
      padding: 16px;
    }

    .pass-list {
      display: grid;
      gap: 10px;
      color: #3f5674;
      font-size: 0.86rem;
      font-weight: 700;
    }

    .pass-qr {
      display: grid;
      place-items: center;
      border-radius: 8px;
      background:
        repeating-linear-gradient(90deg, #dbeafe 0 8px, #fff 8px 15px),
        #fff;
      color: var(--blue-strong);
      font-size: 0.78rem;
      font-weight: 900;
    }

    .exchange-board {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 94px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
    }

    .exchange-site {
      min-height: 180px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .site-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      color: var(--blue-strong);
      font-weight: 900;
    }

    .swap-node {
      display: grid;
      place-items: center;
      width: 94px;
      height: 94px;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      background: var(--surface-soft);
      color: var(--blue-strong);
      box-shadow: inset 0 0 0 8px rgba(255, 255, 255, 0.74);
    }

    .orbit {
      position: relative;
      min-height: 306px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        radial-gradient(circle at center, rgba(255, 255, 255, 0.94) 0 58px, transparent 59px),
        radial-gradient(circle at center, transparent 0 92px, rgba(159, 196, 241, 0.3) 93px 94px, transparent 95px),
        radial-gradient(circle at center, transparent 0 134px, rgba(159, 196, 241, 0.24) 135px 136px, transparent 137px),
        linear-gradient(135deg, #f8fbff, #eaf4ff);
      overflow: hidden;
    }

    .core-site {
      position: absolute;
      left: 50%;
      top: 50%;
      display: grid;
      place-items: center;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: #fff;
      color: var(--blue-strong);
      box-shadow: 0 14px 30px rgba(63, 104, 160, 0.18);
      transform: translate(-50%, -50%);
      font-size: 0.86rem;
      font-weight: 900;
    }

    .planet {
      position: absolute;
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #fff;
      color: var(--blue);
      box-shadow: 0 12px 24px rgba(63, 104, 160, 0.14);
      font-size: 0.76rem;
      font-weight: 900;
    }

    .planet.one {
      left: 16%;
      top: 22%;
    }

    .planet.two {
      right: 18%;
      top: 20%;
    }

    .planet.three {
      left: 24%;
      bottom: 18%;
    }

    .planet.apply {
      right: 20%;
      bottom: 20%;
      border: 2px dashed var(--blue);
      background: var(--surface-soft);
    }

    .launch-bar {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid rgba(159, 196, 241, 0.7);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
    }

    @media (max-width: 920px) {
      .demo-grid,
      .split,
      .exchange-board {
        grid-template-columns: 1fr;
      }

      .swap-node {
        justify-self: center;
      }

      .step-line,
      .field-grid,
      .pass-content {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      .page {
        width: min(100% - 20px, 1180px);
        padding-top: 18px;
      }

      .topbar {
        align-items: start;
        flex-direction: column;
      }

      .demo-head {
        align-items: start;
        flex-direction: column;
      }

      .action-row {
        align-items: stretch;
        flex-direction: column;
      }

      .icon-action {
        width: 100%;
      }
    }
  </style>
</head>
