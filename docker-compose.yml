services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-blog_password_123}"
      MYSQL_DATABASE: chen_blog
      TZ: "${TZ:-Asia/Shanghai}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./renzs-blog-satoken/chen_blog.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/mysql/init/02-default-config.sql:/docker-entrypoint-initdb.d/02-default-config.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - blog-network

  redis:
    image: redis:6.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redis_password_123}"
      TZ: "${TZ:-Asia/Shanghai}"
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:-redis_password_123}"
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - blog-network

  backend:
    build:
      context: ./renzs-blog-satoken
      dockerfile: Dockerfile
    image: renzs-blog-backend:local
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: chen_blog
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-blog_password_123}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redis_password_123}"
      SEARCH_MODE: "${SEARCH_MODE:-mysql}"
      EMAIL_MODE: "${EMAIL_MODE:-direct}"
      UPLOAD_MODE: "${UPLOAD_MODE:-local}"
      UPLOAD_LOCAL_PATH: /app/upload/
      UPLOAD_BASE_URL: "${UPLOAD_BASE_URL:-http://localhost:3000/upload/}"
      SITE_URL: "${SITE_URL:-http://localhost:3000}"
      OSS_URL: "${OSS_URL:-}"
      OSS_ENDPOINT: "${OSS_ENDPOINT:-}"
      OSS_ACCESS_KEY_ID: "${OSS_ACCESS_KEY_ID:-}"
      OSS_ACCESS_KEY_SECRET: "${OSS_ACCESS_KEY_SECRET:-}"
      OSS_BUCKET_NAME: "${OSS_BUCKET_NAME:-}"
      COS_URL: "${COS_URL:-}"
      COS_SECRET_ID: "${COS_SECRET_ID:-}"
      COS_SECRET_KEY: "${COS_SECRET_KEY:-}"
      COS_REGION: "${COS_REGION:-}"
      COS_BUCKET_NAME: "${COS_BUCKET_NAME:-}"
      ALIYUNMAIL_ACCESS_KEY: "${ALIYUNMAIL_ACCESS_KEY:-}"
      ALIYUNMAIL_SECRET_KEY: "${ALIYUNMAIL_SECRET_KEY:-}"
      ALIYUNMAIL_ENDPOINT: "${ALIYUNMAIL_ENDPOINT:-dm.aliyuncs.com}"
      ALIYUNMAIL_REPLY_ADDRESS: "${ALIYUNMAIL_REPLY_ADDRESS:-}"
      ALIYUNMAIL_ACCOUNT_NAME: "${ALIYUNMAIL_ACCOUNT_NAME:-}"
      QQ_APP_ID: "${QQ_APP_ID:-}"
      WEIBO_APP_ID: "${WEIBO_APP_ID:-}"
      WEIBO_APP_SECRET: "${WEIBO_APP_SECRET:-}"
      WEIBO_REDIRECT_URL: "${WEIBO_REDIRECT_URL:-}"
      GITEE_APP_ID: "${GITEE_APP_ID:-}"
      GITEE_APP_SECRET: "${GITEE_APP_SECRET:-}"
      GITEE_REDIRECT_URL: "${GITEE_REDIRECT_URL:-}"
      # Leave this unset by default. RocketMQ starter skips its beans when no name server is configured.
      ROCKETMQ_NAME_SERVER: "${ROCKETMQ_NAME_SERVER:-}"
      ROCKETMQ_PRODUCER_GROUP: "${ROCKETMQ_PRODUCER_GROUP:-email-group}"
      JAVA_OPTS: "${JAVA_OPTS:--Xms256m -Xmx512m}"
      TZ: "${TZ:-Asia/Shanghai}"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8088}:8088"
    volumes:
      - upload-data:/app/upload
      - logs-data:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8088/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks:
      - blog-network

  frontend:
    build:
      context: ./blog-front/blog-vue3
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
    image: renzs-blog-frontend:local
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - upload-data:/usr/share/nginx/html/upload:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - blog-network

  admin:
    build:
      context: ./blog-front/admin
      dockerfile: Dockerfile
    image: renzs-blog-admin:local
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8080}:80"
    volumes:
      - upload-data:/usr/share/nginx/html/upload:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - blog-network

volumes:
  mysql-data:
  redis-data:
  upload-data:
  logs-data:

networks:
  blog-network:
